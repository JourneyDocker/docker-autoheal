[project]
name = "docker-autoheal"
version = "2.0.0"
description = "Monitor and automatically restart unhealthy Docker containers"
authors = [{name = "JourneyOver"}]
dependencies = [
    "requests",
    "docker"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["autoheal"]